<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Alloy Contracting Services</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

<!--
═══════════════════════════════════════════════════════════
  SUPABASE SETUP CHECKLIST (do this once)
  ───────────────────────────────────────────────────────
  1. Create account at supabase.com → New Project
  2. Go to SQL Editor and run:

    create table posts (
      id           uuid default gen_random_uuid() primary key,
      title        text not null,
      slug         text unique not null,
      excerpt      text,
      body         text,
      image_url    text,
      category     text default 'News',
      published    boolean default false,
      created_at   timestamptz default now(),
      published_at timestamptz
    );
    alter table posts enable row level security;
    create policy "Public reads published" on posts for select using (published = true);
    create policy "Admin full access" on posts for all using (auth.role() = 'authenticated');

  3. Storage → Create bucket → Name: post-images → Public: ON
     → Policies → New policy → INSERT: (auth.role() = 'authenticated')

  4. Authentication → Users → Add User → enter your email + password

  5. Settings → API → copy Project URL and anon/public key below
═══════════════════════════════════════════════════════════
-->

<style>
:root {
  --black:#080808;--surf-1:#111111;--surf-2:#181818;--surf-3:#1E1E1E;
  --red:#E8231A;--red-pale:#FF5A52;--white:#FFFFFF;
  --line:rgba(255,255,255,0.08);--line-m:rgba(255,255,255,0.14);
  --txt-1:rgba(255,255,255,0.90);--txt-2:rgba(255,255,255,0.55);--txt-3:rgba(255,255,255,0.28);
  --serif:'Cormorant Garamond','Times New Roman',serif;--sans:'Inter',system-ui,sans-serif;
  --red-grad:linear-gradient(135deg,#C8180F 0%,#E8231A 50%,#C8180F 100%);
  --success:#22C55E;--danger:#EF4444;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--black);color:var(--txt-1);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ── Shared ── */
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:600;padding:11px 22px;border:none;cursor:pointer;transition:opacity 0.2s,transform 0.15s}
.btn:hover{opacity:0.88;transform:translateY(-1px)}
.btn-red{background:var(--red-grad);color:var(--white)}
.btn-ghost{background:transparent;color:var(--txt-2);border:1px solid var(--line-m)}
.btn-ghost:hover{color:var(--txt-1);border-color:var(--line-m)}
.btn-danger{background:var(--danger);color:var(--white)}
.btn-sm{padding:7px 14px;font-size:10px}
.tag{display:inline-block;font-size:9px;letter-spacing:0.24em;text-transform:uppercase;font-weight:600;padding:3px 8px}
.tag-published{background:rgba(34,197,94,0.15);color:var(--success)}
.tag-draft{background:rgba(255,255,255,0.07);color:var(--txt-3)}
.toast{position:fixed;bottom:24px;right:24px;z-index:999;padding:13px 20px;font-size:13px;font-weight:500;border-left:3px solid var(--success);background:var(--surf-2);color:var(--txt-1);box-shadow:0 8px 32px rgba(0,0,0,0.4);opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.toast.error{border-color:var(--danger)}

/* ── LOGIN ── */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:400px;background:var(--surf-1);border:1px solid var(--line);padding:40px 36px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:36px}
.login-logo-wm .a{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:0.18em;color:var(--white)}
.login-logo-wm .c{font-size:7px;letter-spacing:0.32em;text-transform:uppercase;color:var(--red);display:block}
.login-title{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--txt-1);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--txt-2);margin-bottom:28px}
.field{margin-bottom:18px}
.field label{display:block;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--txt-3);margin-bottom:8px;font-weight:500}
.field input{width:100%;padding:12px 14px;background:var(--surf-2);border:1px solid var(--line);color:var(--txt-1);font-size:14px;outline:none;transition:border-color 0.2s}
.field input:focus{border-color:var(--red)}
.login-err{font-size:13px;color:var(--danger);margin-bottom:14px;min-height:20px}
.login-btn{width:100%;padding:14px;background:var(--red-grad);color:var(--white);border:none;font-family:var(--sans);font-size:11px;letter-spacing:0.22em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.login-btn:hover{opacity:0.88}
.login-btn:disabled{opacity:0.5;cursor:not-allowed}

/* ── DASHBOARD ── */
#dashboard-view{display:none}
.admin-header{position:sticky;top:0;z-index:50;background:rgba(8,8,8,0.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px}
.admin-header-brand{display:flex;align-items:center;gap:10px}
.admin-header-brand .a{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:0.18em;color:var(--white)}
.admin-header-brand .c{font-size:7px;letter-spacing:0.3em;text-transform:uppercase;color:var(--red)}
.admin-header-right{display:flex;align-items:center;gap:12px}
.admin-email{font-size:12px;color:var(--txt-3);display:none}
.dash-content{max-width:1100px;margin:0 auto;padding:36px 24px}
.dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:16px;flex-wrap:wrap}
.dash-top h1{font-family:var(--serif);font-size:clamp(24px,4vw,36px);font-weight:500;color:var(--txt-1)}
.posts-table{width:100%;border-collapse:collapse}
.posts-table th{font-size:9px;letter-spacing:0.26em;text-transform:uppercase;color:var(--txt-3);font-weight:500;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.posts-table td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.posts-table tr:last-child td{border-bottom:none}
.posts-table tr:hover td{background:rgba(255,255,255,0.02)}
.post-row-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--txt-1);line-height:1.3}
.post-row-sub{font-size:11px;color:var(--txt-3);margin-top:3px}
.post-row-actions{display:flex;gap:8px;justify-content:flex-end}
.table-wrap{background:var(--surf-1);border:1px solid var(--line);overflow:hidden}
.table-empty{padding:60px 24px;text-align:center;color:var(--txt-3);font-size:14px}

/* ── EDITOR ── */
#editor-view{display:none}
.editor-header{position:sticky;top:0;z-index:50;background:rgba(8,8,8,0.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:58px;gap:16px}
.editor-back{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--txt-3);transition:color 0.2s;cursor:pointer}
.editor-back:hover{color:var(--txt-1)}
.editor-title-bar{font-family:var(--serif);font-size:17px;color:var(--txt-1);font-weight:500}
.editor-actions{display:flex;gap:8px}
.editor-body{max-width:860px;margin:0 auto;padding:36px 24px 80px}
.form-row{margin-bottom:22px}
.form-row label{display:block;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--txt-3);margin-bottom:8px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;background:var(--surf-1);border:1px solid var(--line);color:var(--txt-1);font-size:14px;outline:none;transition:border-color 0.2s;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row select option{background:var(--surf-2)}
.form-row textarea{min-height:80px;line-height:1.6}
.form-hint{font-size:11px;color:var(--txt-3);margin-top:5px}
.form-grid{display:grid;grid-template-columns:1fr;gap:22px}
.img-upload-wrap{position:relative}
.img-preview{width:100%;aspect-ratio:16/9;background:var(--surf-2);border:1px dashed var(--line-m);display:flex;align-items:center;justify-content:center;color:var(--txt-3);font-size:13px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color 0.2s}
.img-preview:hover{border-color:var(--red)}
.img-preview img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.img-preview-text{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#img-input{display:none}
.img-uploading{font-size:12px;color:var(--txt-3);margin-top:6px;min-height:18px}

/* Quill overrides */
.ql-toolbar.ql-snow{background:var(--surf-2);border:1px solid var(--line)!important;border-bottom:none!important}
.ql-container.ql-snow{border:1px solid var(--line)!important;background:var(--surf-1)}
.ql-editor{min-height:320px;font-size:15px;line-height:1.8;color:var(--txt-1);font-family:var(--sans)}
.ql-editor p{color:var(--txt-2)}
.ql-snow .ql-stroke{stroke:var(--txt-2)!important}
.ql-snow .ql-fill{fill:var(--txt-2)!important}
.ql-snow .ql-picker{color:var(--txt-2)!important}
.ql-snow .ql-picker-options{background:var(--surf-2)!important;border-color:var(--line)!important}
.ql-snow .ql-active .ql-stroke,.ql-snow button:hover .ql-stroke{stroke:var(--red)!important}
.ql-snow .ql-active .ql-fill,.ql-snow button:hover .ql-fill{fill:var(--red)!important}
.ql-editor.ql-blank::before{color:var(--txt-3)!important;font-style:normal!important}

/* ── Responsive ── */
@media(min-width:640px){.admin-email{display:block}.form-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.dash-content,.editor-body{padding-left:40px;padding-right:40px}}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-view">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-wm"><span class="a">ALLOY</span><span class="c">Contracting Services</span></div>
    </div>
    <h1 class="login-title">Admin Portal</h1>
    <p class="login-sub">Sign in to manage news &amp; announcements.</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input id="f-email" type="email" placeholder="you@example.com" required autocomplete="email" /></div>
      <div class="field"><label>Password</label><input id="f-password" type="password" placeholder="••••••••" required autocomplete="current-password" /></div>
      <p class="login-err" id="login-err"></p>
      <button class="login-btn" id="login-btn" type="submit">Sign In</button>
    </form>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="dashboard-view">
  <header class="admin-header">
    <div class="admin-header-brand">
      <div><span class="a">ALLOY</span> <span class="c">Admin</span></div>
    </div>
    <div class="admin-header-right">
      <span class="admin-email" id="admin-email"></span>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <div class="dash-content">
    <div class="dash-top">
      <h1>Posts</h1>
      <button class="btn btn-red" id="new-post-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New Post
      </button>
    </div>
    <div class="table-wrap">
      <table class="posts-table">
        <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Status</th><th></th></tr></thead>
        <tbody id="posts-tbody"><tr><td colspan="5" class="table-empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ══ EDITOR ══ -->
<div id="editor-view">
  <header class="editor-header">
    <button class="editor-back" id="editor-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      All Posts
    </button>
    <span class="editor-title-bar" id="editor-title-bar">New Post</span>
    <div class="editor-actions">
      <button class="btn btn-ghost btn-sm" id="save-draft-btn">Save Draft</button>
      <button class="btn btn-red btn-sm" id="publish-btn">Publish</button>
    </div>
  </header>
  <div class="editor-body">
    <div class="form-row">
      <label>Title *</label>
      <input id="f-title" type="text" placeholder="Enter post title…" />
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Slug (URL)</label>
        <input id="f-slug" type="text" placeholder="auto-generated-from-title" />
        <p class="form-hint">URL: post.html?id=<span id="slug-preview">…</span></p>
      </div>
      <div class="form-row">
        <label>Category</label>
        <select id="f-category">
          <option>News</option>
          <option>Announcement</option>
          <option>Update</option>
          <option>Achievement</option>
          <option>Project</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Excerpt <span style="font-size:10px;opacity:0.5;text-transform:none;letter-spacing:0">(short summary shown on cards)</span></label>
      <textarea id="f-excerpt" placeholder="One or two sentences describing this post…" rows="2"></textarea>
    </div>
    <div class="form-row">
      <label>Cover Image</label>
      <div class="img-upload-wrap">
        <div class="img-preview" id="img-preview" onclick="document.getElementById('img-input').click()">
          <div class="img-preview-text">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Click to upload image
          </div>
        </div>
        <input type="file" id="img-input" accept="image/*" />
        <p class="img-uploading" id="img-status"></p>
        <input type="hidden" id="f-image-url" />
      </div>
    </div>
    <div class="form-row">
      <label>Body *</label>
      <div id="quill-editor"></div>
      <p class="form-hint">Use the toolbar to add headings, bold, lists, and links.</p>
    </div>
    <input type="hidden" id="f-post-id" />
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── SUPABASE CONFIG — replace with your values ─── */
var SB_URL = 'YOUR_SUPABASE_URL';
var SB_KEY = 'YOUR_SUPABASE_ANON_KEY';
/* ─────────────────────────────────────────────────── */

if (SB_URL === 'YOUR_SUPABASE_URL') {
  document.getElementById('login-err').textContent = 'Supabase not configured yet. Add your SB_URL and SB_KEY in admin.html.';
}

var sb = supabase.createClient(SB_URL, SB_KEY);
var quill;

// ── Auth ──
sb.auth.onAuthStateChange(function(event, session) {
  if (session) {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    document.getElementById('admin-email').textContent = session.user.email;
    loadPosts();
  } else {
    document.getElementById('login-view').style.display = 'flex';
    document.getElementById('dashboard-view').style.display = 'none';
    document.getElementById('editor-view').style.display = 'none';
  }
});

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('login-btn');
  var err = document.getElementById('login-err');
  btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
  var res = await sb.auth.signInWithPassword({
    email: document.getElementById('f-email').value,
    password: document.getElementById('f-password').value
  });
  if (res.error) { err.textContent = res.error.message; btn.disabled = false; btn.textContent = 'Sign In'; }
});

document.getElementById('logout-btn').addEventListener('click', function() { sb.auth.signOut(); });

// ── Dashboard ──
async function loadPosts() {
  var res = await sb.from('posts').select('id,title,category,published,published_at,created_at,slug').order('created_at', { ascending: false });
  var posts = res.data || [];
  var tbody = document.getElementById('posts-tbody');
  if (!posts.length) { tbody.innerHTML = '<tr><td colspan="5" class="table-empty">No posts yet — create your first one.</td></tr>'; return; }
  tbody.innerHTML = posts.map(function(p) {
    var d = new Date(p.published_at || p.created_at).toLocaleDateString('en-NG', { day:'numeric', month:'short', year:'numeric' });
    return '<tr>' +
      '<td><div class="post-row-title">' + esc(p.title) + '</div><div class="post-row-sub">post.html?id=' + esc(p.slug) + '</div></td>' +
      '<td style="font-size:12px;color:var(--txt-3)">' + esc(p.category||'News') + '</td>' +
      '<td style="font-size:12px;color:var(--txt-3);white-space:nowrap">' + d + '</td>' +
      '<td><span class="tag ' + (p.published ? 'tag-published' : 'tag-draft') + '">' + (p.published ? 'Live' : 'Draft') + '</span></td>' +
      '<td><div class="post-row-actions">' +
        '<button class="btn btn-ghost btn-sm" onclick="editPost(\'' + p.id + '\')">Edit</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deletePost(\'' + p.id + '\',\'' + esc(p.title) + '\')">Delete</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

document.getElementById('new-post-btn').addEventListener('click', function() { openEditor(null); });

// ── Editor ──
function initQuill() {
  if (quill) return;
  quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Write your announcement here…',
    modules: { toolbar: [
      [{ header: [2, 3, false] }],
      ['bold', 'italic', 'underline'],
      [{ list: 'ordered' }, { list: 'bullet' }],
      ['link', 'blockquote'],
      ['clean']
    ]}
  });
}

function openEditor(postId) {
  initQuill();
  document.getElementById('dashboard-view').style.display = 'none';
  document.getElementById('editor-view').style.display = 'block';
  document.getElementById('f-post-id').value = postId || '';
  document.getElementById('img-status').textContent = '';
  document.getElementById('img-input').value = '';

  if (!postId) {
    document.getElementById('editor-title-bar').textContent = 'New Post';
    document.getElementById('f-title').value = '';
    document.getElementById('f-slug').value = '';
    document.getElementById('slug-preview').textContent = '…';
    document.getElementById('f-excerpt').value = '';
    document.getElementById('f-category').value = 'News';
    document.getElementById('f-image-url').value = '';
    resetImgPreview();
    quill.setContents([]);
  }
}

async function editPost(id) {
  var res = await sb.from('posts').select('*').eq('id', id).single();
  var p = res.data;
  if (!p) return;
  openEditor(id);
  document.getElementById('editor-title-bar').textContent = 'Edit Post';
  document.getElementById('f-title').value = p.title || '';
  document.getElementById('f-slug').value = p.slug || '';
  document.getElementById('slug-preview').textContent = p.slug || '…';
  document.getElementById('f-excerpt').value = p.excerpt || '';
  document.getElementById('f-category').value = p.category || 'News';
  document.getElementById('f-image-url').value = p.image_url || '';
  if (p.image_url) showImgPreview(p.image_url);
  else resetImgPreview();
  quill.clipboard.dangerouslyPasteHTML(p.body || '');
}

document.getElementById('editor-back-btn').addEventListener('click', function() {
  document.getElementById('editor-view').style.display = 'none';
  document.getElementById('dashboard-view').style.display = 'block';
  loadPosts();
});

document.getElementById('f-title').addEventListener('input', function() {
  var slug = toSlug(this.value);
  document.getElementById('f-slug').value = slug;
  document.getElementById('slug-preview').textContent = slug || '…';
});

document.getElementById('f-slug').addEventListener('input', function() {
  document.getElementById('slug-preview').textContent = this.value || '…';
});

document.getElementById('save-draft-btn').addEventListener('click', function() { savePost(false); });
document.getElementById('publish-btn').addEventListener('click', function() { savePost(true); });

async function savePost(publish) {
  var title = document.getElementById('f-title').value.trim();
  var slug = document.getElementById('f-slug').value.trim();
  if (!title) { showToast('Please enter a title.', true); return; }
  if (!slug) { showToast('Please enter a URL slug.', true); return; }

  var data = {
    title: title,
    slug: slug,
    excerpt: document.getElementById('f-excerpt').value.trim(),
    body: quill.root.innerHTML,
    category: document.getElementById('f-category').value,
    image_url: document.getElementById('f-image-url').value || null,
    published: publish
  };
  if (publish) data.published_at = new Date().toISOString();

  var id = document.getElementById('f-post-id').value;
  var res = id
    ? await sb.from('posts').update(data).eq('id', id)
    : await sb.from('posts').insert(data);

  if (res.error) { showToast('Error: ' + res.error.message, true); return; }
  showToast(publish ? 'Post published! It is now live on the site.' : 'Draft saved.');
  setTimeout(function() {
    document.getElementById('editor-view').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    loadPosts();
  }, 1200);
}

async function deletePost(id, title) {
  if (!confirm('Delete "' + title + '"? This cannot be undone.')) return;
  await sb.from('posts').delete().eq('id', id);
  showToast('Post deleted.');
  loadPosts();
}

// ── Image upload ──
document.getElementById('img-input').addEventListener('change', async function() {
  var file = this.files[0];
  if (!file) return;
  var status = document.getElementById('img-status');
  status.textContent = 'Uploading…';
  try {
    var ext = file.name.split('.').pop().toLowerCase();
    var name = Date.now() + '.' + ext;
    var up = await sb.storage.from('post-images').upload(name, file, { contentType: file.type, upsert: false });
    if (up.error) throw up.error;
    var url = sb.storage.from('post-images').getPublicUrl(name).data.publicUrl;
    document.getElementById('f-image-url').value = url;
    showImgPreview(url);
    status.textContent = 'Image uploaded.';
  } catch(e) { status.textContent = 'Upload failed: ' + e.message; }
});

function showImgPreview(url) {
  var wrap = document.getElementById('img-preview');
  wrap.innerHTML = '<img src="' + esc(url) + '" alt="Cover" style="width:100%;height:100%;object-fit:cover;display:block" />' +
    '<div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">' +
      '<span style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#fff">Change Image</span>' +
    '</div>';
  wrap.style.position = 'relative';
  wrap.onclick = function() { document.getElementById('img-input').click(); };
}

function resetImgPreview() {
  var wrap = document.getElementById('img-preview');
  wrap.innerHTML = '<div class="img-preview-text">' +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>' +
    'Click to upload image</div>';
}

// ── Helpers ──
function toSlug(s) { return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').substring(0,80); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() { t.classList.remove('show'); }, 3200);
}
</script>
